name: "ptci-pageant-tabulation"

services:
  project-db:
    image: postgres:18.1
    restart: always
    environment:
      - POSTGRES_DB=ptci-pageant-tabulation-db
      - POSTGRES_USER=ptci-pageant-tabulation-user
      - POSTGRES_PASSWORD=ptci-pageant-tabulation-password
    ports:
      - "5436:5432"
    networks:
      - prisma-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ptci-pageant-tabulation-user -d ptci-pageant-tabulation-db" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data_ptci-pageant-tabulation_dev:/var/lib/postgresql
    command: postgres -c listen_addresses=*
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  project-db-test:
    image: postgres:18.1
    restart: always
    environment:
      - POSTGRES_DB=ptci-pageant-tabulation-db-test
      - POSTGRES_USER=ptci-pageant-tabulation-user
      - POSTGRES_PASSWORD=ptci-pageant-tabulation-password
    ports:
      - "5437:5432"
    networks:
      - prisma-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ptci-pageant-tabulation-user -d ptci-pageant-tabulation-db-test" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data_ptci-pageant-tabulation_test:/var/lib/postgresql
    command: postgres -c listen_addresses=*
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  server:
    depends_on:
      project-db:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ptci-pageant-tabulation-user:ptci-pageant-tabulation-password@project-db:5432/ptci-pageant-tabulation-db?schema=public
    volumes:
      - ./prisma:/usr/src/app/prisma
      - ./prisma.config.ts:/usr/src/app/prisma.config.ts
      - ./generated:/usr/src/app/generated
    networks:
      - prisma-dev-network
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    develop:
      watch:
        - action: sync
          path: ./src
          target: "/usr/src/app/src"
        - action: sync
          path: ./tsconfig.json
          target: /usr/src/app/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./Dockerfile.dev

networks:
  prisma-dev-network:
volumes:
  postgres_data_ptci-pageant-tabulation_dev:
  postgres_data_ptci-pageant-tabulation_test:
